name: Make draft release

on:
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build shadowJar e crea la draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: gradlew execution permissions
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew clean test

      - name: Read version
        id: version
        run: |
          VERSION=$(./gradlew -q printVersion)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Building library
        run: ./gradlew build

      - name: Find jar
        id: find_jar
        shell: bash
        run: |
          JAR_PATH=$(find build/libs -name "annotation-exporter-core-*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar")
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "Trovato jar: $JAR_PATH"

      - name: Crea la draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
              --draft \
              --title "v${{ steps.version.outputs.version }}" \
              --notes "" \
              "${{ steps.find_jar.outputs.jar_path }}"
